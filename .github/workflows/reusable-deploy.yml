name: Reusable Docker VPS deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Lowercase application identifier
        required: true
        type: string
      compose_file:
        description: Production Compose file in the repository
        default: compose.production.yml
        type: string
      health_url:
        description: Public URL that must return HTTP 2xx
        required: true
        type: string
      test_command:
        description: Optional trusted shell command executed before deployment
        default: ""
        type: string
      registry_image:
        description: Optional prebuilt image name (for example ghcr.io/owner/app); when set, build and push on GitHub Runner
        default: ""
        type: string
      ssh_port:
        default: 22
        type: number
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: false
      APP_ENV:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.app_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      COMPOSE_FILE: ${{ inputs.compose_file }}
      HEALTH_URL: ${{ inputs.health_url }}
      SSH_PORT: ${{ inputs.ssh_port }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      REGISTRY_IMAGE: ${{ inputs.registry_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]{1,38}$ ]]
          test -f "$COMPOSE_FILE"
          [[ "$COMPOSE_FILE" != /* && "$COMPOSE_FILE" != *".."* ]]
          [[ "$HEALTH_URL" == https://* ]]
          if [ -n "$REGISTRY_IMAGE" ]; then
            [[ "$REGISTRY_IMAGE" == ghcr.io/* ]]
            [[ "$REGISTRY_IMAGE" =~ ^[a-z0-9./_-]+$ ]]
          fi

      - name: Run project checks
        if: inputs.test_command != ''
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Set up Docker Buildx
        if: inputs.registry_image != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR on runner
        if: inputs.registry_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image on runner
        if: inputs.registry_image != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.registry_image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            timeout 20 ssh-keyscan -T 15 -p "$SSH_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          if [ -n "$REGISTRY_IMAGE" ]; then
            tar -czf "$RUNNER_TEMP/release.tgz" "$COMPOSE_FILE"
          else
            tar \
              --exclude=.git \
              --exclude=node_modules \
              --exclude=.venv \
              --exclude='*.env' \
              -czf "$RUNNER_TEMP/release.tgz" .
          fi

      - name: Upload release and environment
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          timeout 60s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p \"\$HOME/apps/$APP_NAME/uploads\" \"\$HOME/apps/$APP_NAME/shared\""
          timeout 180s scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -P "$SSH_PORT" -i ~/.ssh/deploy_key "$RUNNER_TEMP/release.tgz" \
            "$DEPLOY_USER@$DEPLOY_HOST:apps/$APP_NAME/uploads/${GITHUB_SHA}.tgz"
          printf '%s' "$APP_ENV" | timeout 60s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > \"\$HOME/apps/$APP_NAME/shared/app.env\""
          if [ -n "$REGISTRY_IMAGE" ]; then
            printf '%s' "$GHCR_TOKEN" | timeout 60s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          fi

      - name: Start candidate release
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -se' -- "$APP_NAME" "$GITHUB_SHA" "$COMPOSE_FILE" "$REGISTRY_IMAGE" <<'REMOTE'
              set -euo pipefail
              app_name="$1"
              release_sha="$2"
              compose_file="$3"
              registry_image="$4"
              base="$HOME/apps/$app_name"
              release="$base/releases/$release_sha"
              mkdir -p "$release"
              tar -xzf "$base/uploads/$release_sha.tgz" -C "$release"
              cp "$base/shared/app.env" "$release/.env"
              printf '\nIMAGE_TAG=%s\nCOMPOSE_PROJECT_NAME=%s\nREGISTRY_IMAGE=%s\n' "$release_sha" "$app_name" "$registry_image" >> "$release/.env"
              chmod 600 "$release/.env"
              cd "$release"
              if [ -n "$registry_image" ]; then
                docker compose -f "$compose_file" --env-file .env pull
              else
                docker compose -f "$compose_file" --env-file .env build
              fi
              docker compose -f "$compose_file" --env-file .env up -d --remove-orphans
          REMOTE

      - name: Verify candidate
        run: curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 5 "$HEALTH_URL"

      - name: Promote release
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn \"\$HOME/apps/$APP_NAME/releases/$GITHUB_SHA\" \"\$HOME/apps/$APP_NAME/current\" && rm -f \"\$HOME/apps/$APP_NAME/uploads/$GITHUB_SHA.tgz\""

      - name: Roll back on failure
        if: failure()
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -se' -- "$APP_NAME" "$COMPOSE_FILE" <<'REMOTE'
              set -euo pipefail
              app_name="$1"
              compose_file="$2"
              current="$HOME/apps/$app_name/current"
              if [ -d "$current" ]; then
                cd "$current"
                docker compose -f "$compose_file" --env-file .env up -d --remove-orphans
              fi
              docker compose -p "$app_name" logs --tail=150 || true
          REMOTE
